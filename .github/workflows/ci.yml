name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: admin-server
          # Phase 1 Week 4-5 扩大范围：golangci-lint run ./... 复核全仓库结果是 0 issue，
          # 直接扫全仓库，不再限制路径（见 admin-server/docs/09-ci-cd-and-deployability.md 第 3 节）。
          args: --timeout=5m ./...
      - name: go build
        run: cd admin-server && go build ./...

  unit-test:
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go test (unit)
        # 范围严格对齐 08-testing-strategy.md 的口径：只跑领域服务 + repository 层，
        # 不是 go test ./...；集成测试（//go:build integration）默认不会被这条命令带上。
        # services/task/...、services/sdk/...、services/chat/...、services/content/...、
        # services/iam/... 是 Phase 2 拆出的 task-rpc/sdk-rpc/chat-rpc/content-rpc/iam-rpc，
        # 全部领域的领域服务/repository/TaskCallback+IamCallback server 实现都已经搬到这里，
        # internal/domain/、internal/repository/、internal/rpcserver/ 三个目录已整体删除。
        run: cd admin-server && go test ./services/task/... ./services/sdk/... ./services/chat/... ./services/content/... ./services/iam/... -race -count=1

  integration-test:
    runs-on: ubuntu-latest
    needs: lint-build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admin_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 初始化测试库
        # 顺序与 admin-server/db/services/init-dev-db.sh 保持一致，两处如果后续调整需要同步改。
        run: |
          MYSQL_ROOT_PASSWORD=root MYSQL_DATABASE=admin_test \
            admin-server/db/services/init-dev-db.sh -h127.0.0.1
      - name: go test (integration)
        run: cd admin-server && go test -tags=integration ./... -count=1
        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/admin_test
          TEST_REDIS_ADDR: 127.0.0.1:6379

  build-images:
    # 只在 push 到 main 时构建+推送镜像（feature/** push 和 PR 只跑上面三个门槛 job，
    # 不产出镜像），见 admin-server/docs/21-cd-and-deployment.md 第 4 节。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-build, unit-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # gateway 对应仓库根 admin-server/Dockerfile（gateway 是 admin-server 的根 main
        # 包 admin.go，不是独立的 cmd/gateway/ 目录，21-cd-and-deployment.md 写的
        # cmd/gateway/Dockerfile 是当时的规划路径，落地时按 Phase 2 实际拆分结果调整）；
        # 其余五个对应各自 services/<name>/Dockerfile。
        include:
          - service: gateway
            dockerfile: Dockerfile
          - service: iam
            dockerfile: services/iam/Dockerfile
          - service: content
            dockerfile: services/content/Dockerfile
          - service: chat
            dockerfile: services/chat/Dockerfile
          - service: task
            dockerfile: services/task/Dockerfile
          - service: sdk
            dockerfile: services/sdk/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./admin-server
          file: ./admin-server/${{ matrix.dockerfile }}
          push: true
          # 六个独立镜像仓库，tag 用完整 git sha（不用 latest），保证每次部署可追溯到
          # 具体提交，见 21-cd-and-deployment.md 第 4 节镜像命名规则。
          tags: ghcr.io/${{ github.repository_owner }}/admin-${{ matrix.service }}:${{ github.sha }}

  deploy-dev:
    # 镜像推送 ghcr 成功后，SSH 到 bgg-dev 执行 script/deploy-dev.sh（pull + up 六个服务）。
    # 连接信息存 GitHub Secrets：DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KEY。
    # bgg-dev 在国内直连 ghcr.io 拉六个镜像可能较慢，command_timeout 留足余量（默认 10m 不够）。
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-images]
    runs-on: ubuntu-latest
    steps:
      - name: 部署到 bgg-dev
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 45m
          script: |
            cd /home/work/src-bgg
            git checkout main
            git pull origin main
            TAG=${{ github.sha }} bash script/deploy-dev.sh

  deploy-frontend:
    # Runner 上 pnpm build 后 scp + SSH 替换 bgg-dev 静态 dist（服务器无 Node）。
    # 与后端镜像无关，lint-build 通过即可并行；远端目录须属主为 DEPLOY_SSH_USER（ubuntu），
    # 一次性：sudo chown -R ubuntu:ubuntu /home/work/service/admin-frontend
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: admin-frontend/pnpm-lock.yaml
      - name: 构建前端
        run: |
          cd admin-frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: 打包 dist
        run: tar -czf admin-frontend_${{ github.sha }}.tar.gz -C admin-frontend/dist .
      - name: 上传到 bgg-dev
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: admin-frontend_${{ github.sha }}.tar.gz
          target: /tmp/
      - name: 远端替换 dist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            REMOTE_FRONTEND_DIR=/home/work/service/admin-frontend
            REMOTE_TAR=/tmp/admin-frontend_${{ github.sha }}.tar.gz
            if [ ! -w "$REMOTE_FRONTEND_DIR" ]; then
              echo "远端目录不可写: $REMOTE_FRONTEND_DIR"
              echo "请先执行: sudo chown -R ubuntu:ubuntu $REMOTE_FRONTEND_DIR"
              exit 1
            fi
            cd "$REMOTE_FRONTEND_DIR"
            if [ -d dist ]; then
              mv dist dist_$(date +%Y%m%d%H%M%S).bak
            fi
            mkdir -p dist
            tar -xzf "$REMOTE_TAR" -C dist
            rm -f "$REMOTE_TAR"
            echo "前端部署完成: $REMOTE_FRONTEND_DIR/dist"
            curl -sk -o /dev/null -w "GET /bgg/ -> %{http_code}\n" https://oldbai.top/bgg/

  notify-feishu:
    # 镜像构建 + 后端部署 + 前端部署全部跑完后发一条汇总通知；Webhook 存 GitHub Secret FEISHU_WEBHOOK_URL。
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-images, deploy-dev, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: 推送飞书通知
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          DEPLOY_RESULT: ${{ needs.deploy-dev.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "未配置 FEISHU_WEBHOOK_URL，跳过通知"
            exit 0
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            BUILD_STATUS="✅ 成功"
          else
            BUILD_STATUS="❌ 失败"
          fi

          case "$DEPLOY_RESULT" in
            success)
              DEPLOY_STATUS="✅ 成功（bgg-dev 六服务镜像已更新）"
              ;;
            failure)
              DEPLOY_STATUS="❌ 失败"
              ;;
            skipped)
              DEPLOY_STATUS="⏭️ 跳过（镜像构建未成功或未触发）"
              ;;
            *)
              DEPLOY_STATUS="⚠️ ${DEPLOY_RESULT:-未知}"
              ;;
          esac

          case "$FRONTEND_RESULT" in
            success)
              FRONTEND_STATUS="✅ 成功（admin-frontend dist 已更新）"
              ;;
            failure)
              FRONTEND_STATUS="❌ 失败"
              ;;
            skipped)
              FRONTEND_STATUS="⏭️ 跳过（lint-build 未成功或未触发）"
              ;;
            *)
              FRONTEND_STATUS="⚠️ ${FRONTEND_RESULT:-未知}"
              ;;
          esac

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ] && [ "$FRONTEND_RESULT" = "success" ]; then
            SUMMARY="✅ 镜像构建与 bgg-dev 前后端部署均成功"
            COLOR="green"
          else
            SUMMARY="❌ CI/CD 未全部成功"
            COLOR="red"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(printf '%s' "${{ github.event.head_commit.message }}" | head -1)
          OWNER="${{ github.repository_owner }}"
          TAG="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          jq -n \
            --arg summary "$SUMMARY" \
            --arg color "$COLOR" \
            --arg build_status "$BUILD_STATUS" \
            --arg deploy_status "$DEPLOY_STATUS" \
            --arg frontend_status "$FRONTEND_STATUS" \
            --arg ref "${{ github.ref_name }}" \
            --arg short_sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg msg "$COMMIT_MSG" \
            --arg tag "$TAG" \
            --arg owner "$OWNER" \
            --arg run_url "$RUN_URL" \
            '{
              msg_type: "interactive",
              card: {
                header: {
                  title: { tag: "plain_text", content: "CI 构建与 bgg-dev 部署通知" },
                  template: $color
                },
                elements: [
                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: (
                        "**总览**: " + $summary + "\n" +
                        "**镜像构建**: " + $build_status + "\n" +
                        "**后端部署**: " + $deploy_status + "\n" +
                        "**前端部署**: " + $frontend_status + "\n" +
                        "**分支**: " + $ref + "\n" +
                        "**提交**: [" + $short_sha + "](" + $commit_url + ")\n" +
                        "**说明**: " + $msg + "\n" +
                        "**镜像 tag**: `" + $tag + "`\n" +
                        "**镜像**:\n" +
                        "- ghcr.io/" + $owner + "/admin-gateway:" + $tag + "\n" +
                        "- ghcr.io/" + $owner + "/admin-iam:" + $tag + "\n" +
                        "- ghcr.io/" + $owner + "/admin-content:" + $tag + "\n" +
                        "- ghcr.io/" + $owner + "/admin-chat:" + $tag + "\n" +
                        "- ghcr.io/" + $owner + "/admin-task:" + $tag + "\n" +
                        "- ghcr.io/" + $owner + "/admin-sdk:" + $tag
                      )
                    }
                  },
                  {
                    tag: "action",
                    actions: [
                      {
                        tag: "button",
                        text: { tag: "plain_text", content: "查看 Actions" },
                        url: $run_url,
                        type: "primary"
                      }
                    ]
                  }
                ]
              }
            }' | curl -sfS -X POST "$FEISHU_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @-
